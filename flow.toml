[[stage]]
roles = ["architect A", "architect B"]

[[stage]]
roles = ["coder"]

[[stage]]
roles = ["verifier"]

[stage.back]
to = 2
when = "failures"
at_most = 2

[[stage]]
roles = ["reviewer A", "reviewer B"]

[stage.back]
to = 2
when = "act on findings"
at_most = 3
